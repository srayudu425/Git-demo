name: Terraform OIDC Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - appservice

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: storage
        run: terraform init

      - name: Terraform Import   # 👈 ADD HERE (temporary)
        working-directory: storage
        run: terraform import azurerm_resource_group.rg /subscriptions/${{ secrets.ARM_SUBSCRIPTION_ID }}/resourceGroups/rg-tfstate || true
      
      #- name: Terraform Import Service Plan
      #  working-directory: terraform-azure-appservice
      #  run: terraform import azurerm_service_plan.asp /subscriptions/${{ secrets.ARM_SUBSCRIPTION_ID }}/resourceGroups/rg-free-appservice/providers/Microsoft.Web/serverFarms/free-asp-plan

      - name: Terraform Validate
        working-directory: storage 
        run: terraform validate

      - name: Terraform Plan
        working-directory: storage
        run: terraform plan

      - name: Terraform Apply
        working-directory: storage
        run: terraform apply -auto-approve
